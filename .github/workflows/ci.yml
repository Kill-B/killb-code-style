name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  eslint-10:
    name: base and node presets on ESLint 10
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install as an ESLint 10 consumer would (the Next stack still pins ESLint 9)
        run: |
          npm pkg delete devDependencies.eslint-config-next devDependencies.next devDependencies.react devDependencies.react-dom devDependencies.@types/react
          npm pkg set devDependencies.eslint=^10.0.0 devDependencies.@eslint/js=^10.0.0
          rm package-lock.json
          npm install --no-audit --no-fund
      - run: node --test test/eslint.test.mjs test/prettier.test.mjs
